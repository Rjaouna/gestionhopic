framework:
    secret: '%env(APP_SECRET)%'
    default_locale: fr
    csrf_protection: true
    session:
        cookie_httponly: true
        cookie_samesite: lax
        cookie_secure: auto
    asset_mapper:
        paths:
            - assets/
    mailer:
        dsn: '%env(MAILER_DSN)%'
    translator:
        fallbacks: [fr]
